{% extends "base.html" %}

{% block content %}
<style>
    .tool-tabs-shell {
        border: 1px solid #d8e4f2;
        background: #f8fbff;
        border-radius: 0.65rem;
        padding: 0.4rem 0.55rem 0;
        margin-bottom: 1rem;
    }
    .tool-tabs {
        display: flex;
        align-items: flex-end;
        gap: 0.4rem;
        flex-wrap: wrap;
    }
    .tool-tab-link {
        display: inline-block;
        margin-bottom: -1px;
        padding: 0.7rem 1.1rem;
        border: 1px solid transparent;
        border-radius: 0.5rem 0.5rem 0 0;
        font-size: 0.95rem;
        font-weight: 600;
        color: #6b7d99;
        line-height: 1;
        transition: all 120ms ease;
    }
    .tool-tab-link:hover { color: #213a63; }
    .tool-tab-link.is-active {
        background: #ffffff;
        color: #125fcb;
        border-color: #cad8ea;
        box-shadow: 0 1px 3px rgba(18, 95, 203, 0.15);
    }
    @media (max-width: 640px) {
        .tool-tab-link {
            padding: 0.6rem 0.85rem;
            font-size: 0.85rem;
        }
    }
</style>
<div class="w-full px-2 sm:px-3 md:px-4 py-4">
    <div class="tool-tabs-shell">
        <nav class="tool-tabs" aria-label="Tool views">
            <a href="{% url 'land_record_712_list' %}" class="tool-tab-link is-active">७/१२ उतार नोंद</a>
            <a href="{% url 'ready_reckoner_list' %}" class="tool-tab-link">रेडी रेकनर दर</a>
            <a href="{% url 'village_info' %}" class="tool-tab-link">गावाची माहिती</a>
            <a href="{% url 'add_entry' %}" class="tool-tab-link">नुकसान भरपाई नोंद</a>
            <a href="{% url 'process_chart_form' %}" class="tool-tab-link">भूसंपादन प्रक्रिया</a>
        </nav>
    </div>
<div class="w-full mx-auto bg-white p-3 sm:p-4 md:p-6 border border-gray-300 mt-4 sm:mt-6 rounded-lg shadow">
    <h2 class="text-center font-bold text-xl underline">७/१२ उतारा संपादन</h2>

    {% if error_message %}
        <div class="mt-4 rounded border border-red-300 bg-red-50 p-3 text-sm font-semibold text-red-700">
            {{ error_message }}
        </div>
    {% endif %}

    <form method="POST" class="mt-6">
        {% csrf_token %}

        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 text-sm">
            <div>
                <label class="font-semibold">जिल्हा</label>
                <input type="text" name="district" value="{{ obj.district|default:'उपलब्ध नाही' }}" required readonly class="w-full border p-2 rounded bg-gray-100 cursor-not-allowed">
            </div>
            <div>
                <label class="font-semibold">तालुका</label>
                <input type="text" name="taluka" value="{{ obj.taluka|default:'उपलब्ध नाही' }}" required readonly class="w-full border p-2 rounded bg-gray-100 cursor-not-allowed">
            </div>
            <div>
                <label class="font-semibold">गाव</label>
                <input type="text" name="village" value="{{ obj.village|default:'उपलब्ध नाही' }}" required readonly class="w-full border p-2 rounded bg-gray-100 cursor-not-allowed">
            </div>
            <div>
                <label class="font-semibold">गट क्रमांक</label>
                <input type="text" name="gut_number" value="{{ obj.gut_number|default:'उपलब्ध नाही' }}" required readonly class="w-full border p-2 rounded bg-gray-100 cursor-not-allowed">
            </div>
        </div>

        <div class="mt-6 border-t pt-4">
            <h3 class="font-semibold text-sm text-gray-700 mb-3">७/१२ माहिती</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 text-sm">
                <div>
                    <label class="font-semibold">खाता नं</label>
                    <input type="text" name="khata_number" value="{{ obj.khata_number|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="font-semibold">PUID/ULIP नं</label>
                    <input type="text" name="puid_ulip_no" value="{{ obj.puid_ulip_no|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label class="font-semibold">जिरायत</label>
                    <input type="text" name="jirayit" value="{{ obj.jirayit|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="font-semibold">बागायत</label>
                    <input type="text" name="bagayat" value="{{ obj.bagayat|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="font-semibold">पोटखराब</label>
                    <input type="text" name="potkharaba" value="{{ obj.potkharaba|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label class="font-semibold">एकूण क्षेत्र</label>
                    <input type="text" name="total_area" value="{{ obj.total_area|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="font-semibold">आकारणी</label>
                    <input type="text" name="aakarni" value="{{ obj.aakarni|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="font-semibold">खाता क्षेत्र</label>
                    <input type="text" name="khata_area" value="{{ obj.khata_area|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label class="font-semibold">आकार</label>
                    <input type="text" name="aakar" value="{{ obj.aakar|default:'उपलब्ध नाही' }}" class="w-full border p-2 rounded">
                </div>

                <div class="md:col-span-3">
                    <label class="font-semibold">भोगवटदाराचे नांव</label>
                    <textarea name="holder_name" rows="3" class="w-full border p-2 rounded">{{ obj.holder_name|default:'उपलब्ध नाही' }}</textarea>
                </div>

                <div class="md:col-span-3">
                    <label class="font-semibold">कुळ, खंड व इतर अधिकार</label>
                    <textarea name="kul_khand_other_rights" rows="4" class="w-full border p-2 rounded" placeholder="कुळ, खंड व इतर अधिकाराची माहिती येथे लिहा...">{{ obj.kul_khand_other_rights|default:'उपलब्ध नाही' }}</textarea>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mt-6">
            <a href="{% url 'land_record_712_list' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded text-center">← यादीकडे जा</a>
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">अपडेट करा</button>
            <a href="{% url 'delete_land_record_712' obj.id %}" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-center" onclick="return confirm('तुम्हाला ही नोंद हटवायची आहे का?');">हटवा</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
