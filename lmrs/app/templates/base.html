<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    {% load static %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purandar CMS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <!-- Bootstrap Style -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
</head>

<body class="bg-gray-100">

    <!-- ✅ NAVBAR -->
    <header class="flex justify-between items-center bg-white px-6 py-3 shadow">

        <div class="flex items-center gap-3">
            <div class="h-9 w-9 rounded-lg bg-white border border-slate-200 shadow-sm overflow-hidden flex items-center justify-center">
                <img src="{% static 'logo/purandar_airport.png' %}" alt="Purandar Airport logo" class="h-full w-full object-contain p-1">
            </div>
            <h2 class="font-bold text-lg text-blue-600">
                Purandar Airport CMS
            </h2>
        </div>

        <div class="flex items-center gap-5">

            <!-- Role Based -->
            <!-- 🔥 NAV TABS -->
            <!-- 🔥 NAV TABS -->
            <div class="flex items-center gap-4">

                <!-- Dashboard → ONLY ADMIN -->
                {% if request.user.is_superuser %}
                <a href="/" class="px-4 py-1 rounded-full text-sm font-semibold
           {% if request.path == '/' %}
               bg-blue-600 text-white
           {% else %}
               text-gray-600 hover:bg-gray-200
           {% endif %}">
                    Dashboard
                </a>
                {% endif %}

                <!-- Tools → ADMIN + STAFF -->
                {% if request.user.is_staff %}
                <a href="/tools/" class="px-4 py-1 rounded-full text-sm font-semibold
           {% if '/tools' in request.path %}
               bg-blue-600 text-white
           {% else %}
               text-gray-600 hover:bg-gray-200
           {% endif %}">
                    Tools
                </a>
                {% endif %}

            </div>
            <!-- User -->
            <span>{{ request.user.username }}</span>

            <a href="/logout/" class="text-red-500">Logout</a>

        </div>

    </header>

    <!-- ✅ PAGE CONTENT -->
    <div>
        {% block content %}
        {% endblock %}
    </div>

    <script>
        const menuBtn = document.getElementById("menuBtn");
        const dropdown = document.getElementById("menuDropdown");

        if (menuBtn && dropdown) {
            menuBtn.addEventListener("click", () => {
                dropdown.classList.toggle("hidden");
            });

            document.addEventListener("click", (e) => {
                if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add("hidden");
                }
            });
        }
    </script>

</body>

</html>
