{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white p-6 border border-gray-300 mt-6 rounded-lg shadow">
    <h2 class="text-center font-bold text-xl underline">रेडी रेकनर दर नोंद</h2>
    <p class="text-center text-sm mt-1 text-gray-500">जमिनीचा बाजारभाव दर भरा</p>

    <form method="POST" enctype="multipart/form-data" class="mt-6" id="rrForm">
        {% csrf_token %}

        <!-- Location -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
            <div>
                <label class="font-semibold">जिल्हा</label>
                <select id="district" name="district" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">जिल्हा निवडा</option>
                </select>
            </div>
            <div>
                <label class="font-semibold">तालुका</label>
                <select id="taluka" name="taluka" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">तालुका निवडा</option>
                </select>
            </div>
            <div>
                <label class="font-semibold">गाव</label>
                <select id="village" name="village" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">गाव निवडा</option>
                </select>
            </div>
        </div>

        <!-- Year -->
        <div class="mt-4">
            <label class="font-semibold text-sm">वर्ष (Year)</label>
            <input type="text" name="year" required placeholder="उदा. 2025-2026" class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400 text-sm mt-1">
        </div>

        <!-- Assessment Type Blocks -->
        <div class="mt-6 border-t pt-4">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-base">मूल्यांकन प्रकार</h3>
                <button type="button" onclick="addAssessmentBlock()" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white text-sm rounded font-medium">+ मूल्यांकन प्रकार जोडा</button>
            </div>
            <div id="assessmentBlocks" class="space-y-4"></div>
        </div>

        <!-- Document Upload -->
        <div class="mt-6 border-t pt-4">
            <label class="font-semibold text-sm mb-2 block">दस्तऐवज अपलोड करा</label>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 bg-gray-50 text-center">
                <input type="file" id="documents" name="documents" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" multiple class="hidden">
                <button type="button" onclick="document.getElementById('documents').click()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded text-sm">फाइल निवडा</button>
                <p class="text-xs text-gray-500 mt-1">PDF, JPG, PNG, DOC, DOCX (कमाल 5MB)</p>
            </div>
            <div id="filesList" class="mt-2 space-y-1 hidden"><div id="filesContainer"></div></div>
        </div>

        <div class="flex gap-3 mt-6">
            <button type="button" onclick="window.history.back()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded">← मागे जा</button>
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-medium">सबमिट करा</button>
            <a href="{% url 'ready_reckoner_list' %}" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded">नोंदी पहा</a>
        </div>
    </form>
</div>

<script>
// ── Location cascades ──────────────────────────────────────────────────────
let fullData = [];
fetch('/api/location-data/').then(r => r.json()).then(data => {
    fullData = data.villages || [];
    const d = document.getElementById('district');
    [...new Set(fullData.map(v => v.district).filter(Boolean))].forEach(x => d.add(new Option(x, x)));
});
document.getElementById('district').addEventListener('change', function () {
    const t = document.getElementById('taluka'), v = document.getElementById('village');
    t.innerHTML = '<option value="">तालुका निवडा</option>';
    v.innerHTML = '<option value="">गाव निवडा</option>';
    [...new Set(fullData.filter(x => x.district === this.value).map(x => x.taluka).filter(Boolean))].forEach(x => t.add(new Option(x, x)));
});
document.getElementById('taluka').addEventListener('change', function () {
    const d = document.getElementById('district').value, v = document.getElementById('village');
    v.innerHTML = '<option value="">गाव निवडा</option>';
    [...new Set(fullData.filter(x => x.district === d && x.taluka === this.value).map(x => x.village_name).filter(Boolean))].forEach(x => v.add(new Option(x, x)));
});

// ── Assessment block counter ───────────────────────────────────────────────
let blockCount = 0;

function addAssessmentBlock() {
    const idx = blockCount++;
    const container = document.getElementById('assessmentBlocks');
    const block = document.createElement('div');
    block.className = 'assessment-block border border-orange-200 rounded-lg p-4 bg-orange-50';
    block.dataset.idx = idx;
    block.innerHTML = `
        <div class="flex items-center justify-between mb-3">
            <span class="font-semibold text-sm text-orange-700">मूल्यांकन प्रकार #<span class="block-num">${container.children.length + 1}</span></span>
            <button type="button" onclick="removeBlock(this)" class="text-red-500 hover:text-red-700 text-sm font-medium">✕ हटवा</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
            <div>
                <label class="text-xs font-semibold text-gray-600">मूल्यांकन प्रकार (Assessment Type)</label>
                <input type="text" name="assessment_type[]" required placeholder="उदा. जिरायत, बागायत"
                    class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400 text-sm mt-1">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600">एकक (Unit)</label>
                <select name="unit[]" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400 text-sm mt-1">
                    <option value="हेक्टर">हेक्टर</option>
                    <option value="चौ. मीटर">चौ. मीटर</option>
                </select>
            </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-lg p-3">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-gray-600">आकारणी श्रेणी व दर</span>
                <button type="button" onclick="addRateRow(this)" class="px-2 py-1 bg-orange-400 hover:bg-orange-500 text-white text-xs rounded">+ दर ओळ जोडा</button>
            </div>
            <div class="rate-rows space-y-2">
                ${rateRowHTML()}
            </div>
        </div>`;
    container.appendChild(block);
    renumberBlocks();
}

function rateRowHTML(min='', max='', rate='') {
    return `<div class="rate-row grid grid-cols-3 gap-2 items-end">
        <div>
            <label class="text-xs text-gray-500">किमान (Min)</label>
            <input type="number" step="0.01" name="assessment_range_min[]" value="${min}" placeholder="0.00" required
                class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400 text-sm">
        </div>
        <div>
            <label class="text-xs text-gray-500">कमाल (Max)</label>
            <input type="number" step="0.01" name="assessment_range_max[]" value="${max}" placeholder="0.00" required
                class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400 text-sm">
        </div>
        <div class="flex gap-2 items-end">
            <div class="flex-1">
                <label class="text-xs text-gray-500">दर (Rate) ₹</label>
                <input type="number" step="0.01" name="rate[]" value="${rate}" placeholder="0.00" required
                    class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400 text-sm">
            </div>
            <button type="button" onclick="removeRateRow(this)" class="mb-0.5 px-2 py-2 bg-red-400 hover:bg-red-500 text-white rounded text-xs">✕</button>
        </div>
    </div>`;
}

function addRateRow(btn) {
    const rateRows = btn.closest('.bg-white').querySelector('.rate-rows');
    const div = document.createElement('div');
    div.innerHTML = rateRowHTML();
    rateRows.appendChild(div.firstElementChild);
}

function removeRateRow(btn) {
    const row = btn.closest('.rate-row');
    const rows = row.closest('.rate-rows');
    if (rows.querySelectorAll('.rate-row').length > 1) row.remove();
}

function removeBlock(btn) {
    btn.closest('.assessment-block').remove();
    renumberBlocks();
}

function renumberBlocks() {
    document.querySelectorAll('.assessment-block').forEach((b, i) => {
        b.querySelector('.block-num').textContent = i + 1;
    });
}

// ── File upload ────────────────────────────────────────────────────────────
(function () {
    const fileInput = document.getElementById('documents');
    const filesList = document.getElementById('filesList');
    const filesContainer = document.getElementById('filesContainer');
    let selectedFiles = [];
    fileInput.addEventListener('change', e => {
        selectedFiles = Array.from(e.target.files).filter(f => f.size <= 5 * 1024 * 1024);
        render();
    });
    function render() {
        filesContainer.innerHTML = selectedFiles.map((f, i) =>
            `<div class="flex justify-between items-center text-sm bg-white border rounded p-2">
                <span>${f.name}</span>
                <button type="button" onclick="removeFile(${i})" class="text-red-500 text-xs">✕</button>
            </div>`).join('');
        filesList.classList.toggle('hidden', !selectedFiles.length);
    }
    window.removeFile = function (i) {
        selectedFiles.splice(i, 1);
        const dt = new DataTransfer();
        selectedFiles.forEach(f => dt.items.add(f));
        fileInput.files = dt.files;
        render();
    };
})();

// ── Form submit: inject block-index separators ─────────────────────────────
document.getElementById('rrForm').addEventListener('submit', function (e) {
    // Validate at least one assessment block
    const blocks = document.querySelectorAll('.assessment-block');
    if (blocks.length === 0) {
        e.preventDefault();
        alert('किमान एक मूल्यांकन प्रकार जोडा.');
        return;
    }
    // Inject hidden block_count so backend knows how many blocks
    let inp = document.getElementById('block_count_input');
    if (!inp) { inp = document.createElement('input'); inp.type = 'hidden'; inp.name = 'block_count'; inp.id = 'block_count_input'; this.appendChild(inp); }
    inp.value = blocks.length;

    // Re-index all inputs per block so backend can group them
    blocks.forEach((block, bi) => {
        block.querySelector('input[name="assessment_type[]"]').name = `assessment_type[${bi}]`;
        block.querySelector('select[name="unit[]"]').name = `unit[${bi}]`;
        block.querySelectorAll('input[name="assessment_range_min[]"]').forEach((el, ri) => { el.name = `assessment_range_min[${bi}][${ri}]`; });
        block.querySelectorAll('input[name="assessment_range_max[]"]').forEach((el, ri) => { el.name = `assessment_range_max[${bi}][${ri}]`; });
        block.querySelectorAll('input[name="rate[]"]').forEach((el, ri) => { el.name = `rate[${bi}][${ri}]`; });
    });
});

// Add first block on load
addAssessmentBlock();
</script>
{% endblock %}
