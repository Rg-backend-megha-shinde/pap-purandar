{% extends "base.html" %}

{% block content %}

<div class="max-w-4xl mx-auto bg-white p-6 border border-gray-300 mt-6 rounded-lg shadow">

    <!-- HEADER -->
    <h2 class="text-center font-bold text-xl underline">
        रेडी रेकनर दर नोंद
    </h2>
    <p class="text-center text-sm mt-1 text-gray-500">
        जमिनीचा बाजारभाव दर भरा
    </p>

    <form method="POST" class="mt-6">
        {% csrf_token %}

        <!-- LOCATION SECTION -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">

            <div>
                <label class="font-semibold">जिल्हा</label>
                <select id="district" name="district" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">जिल्हा निवडा</option>
                </select>
            </div>

            <div>
                <label class="font-semibold">तालुका</label>
                <select id="taluka" name="taluka" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">तालुका निवडा</option>
                </select>
            </div>

            <div>
                <label class="font-semibold">गाव</label>
                <select id="village" name="village" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">गाव निवडा</option>
                </select>
            </div>

        </div>

        <!-- RATE DETAILS -->
        <div class="mt-6 border-t pt-4">
            <h3 class="font-semibold text-sm text-gray-700 mb-3">दर माहिती</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">

                <div class="md:col-span-2">
                    <label class="font-semibold">मूल्यांकन प्रकार (Assessment Type)</label>
                    <input type="text" name="assessment_type" required
                        placeholder="उदा. जिरायत, बागायत, निवासी"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">आकारणी श्रेणी - किमान (Range Min)</label>
                    <input type="number" step="0.01" name="assessment_range_min" required
                        placeholder="उदा. 0.00"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">आकारणी श्रेणी - कमाल (Range Max)</label>
                    <input type="number" step="0.01" name="assessment_range_max" required
                        placeholder="उदा. 10.00"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">दर (Rate) ₹</label>
                    <input type="number" step="0.01" name="rate" required
                        placeholder="उदा. 2298500"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">एकक (Unit)</label>
                    <select name="unit" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                        <option value="">एकक निवडा</option>
                        <option value="हेक्टर">हेक्टर</option>
                        <option value="चौ. मीटर">चौ. मीटर</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- BUTTONS -->
        <div class="flex gap-3 mt-6">
            <button type="button" onclick="window.history.back()"
                class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded">
                ← मागे जा
            </button>
            <button type="submit"
                class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2 rounded">
                सबमिट करा
            </button>
        </div>

    </form>

</div>

<script>

let fullData = [];

fetch('/api/location-data/')
    .then(res => res.json())
    .then(data => {
        fullData = data.villages;
        let districtDropdown = document.getElementById("district");
        let districts = [...new Set(fullData.map(v => v.district))];
        districts.forEach(d => {
            if (d) districtDropdown.add(new Option(d, d));
        });
    });

document.getElementById("district").addEventListener("change", function () {
    let district = this.value;
    let talukaDropdown = document.getElementById("taluka");
    let villageDropdown = document.getElementById("village");

    talukaDropdown.innerHTML = '<option value="">तालुका निवडा</option>';
    villageDropdown.innerHTML = '<option value="">गाव निवडा</option>';

    let talukas = [...new Set(fullData.filter(v => v.district === district).map(v => v.taluka))];
    talukas.forEach(t => talukaDropdown.add(new Option(t, t)));
});

document.getElementById("taluka").addEventListener("change", function () {
    let taluka = this.value;
    let district = document.getElementById("district").value;
    let villageDropdown = document.getElementById("village");

    villageDropdown.innerHTML = '<option value="">गाव निवडा</option>';

    let uniqueVillages = [...new Set(
        fullData.filter(v => v.taluka === taluka && v.district === district).map(v => v.village_name)
    )];
    uniqueVillages.forEach(v => villageDropdown.add(new Option(v, v)));
});

</script>

{% endblock %}
