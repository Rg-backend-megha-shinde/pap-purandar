{% extends "base.html" %}

{% block content %}

<div class="max-w-4xl mx-auto bg-white p-6 border border-gray-300 mt-6 rounded-lg shadow">

    <!-- HEADER -->
    <h2 class="text-center font-bold text-xl underline">
        रेडी रेकनर दर नोंद
    </h2>
    <p class="text-center text-sm mt-1 text-gray-500">
        जमिनीचा बाजारभाव दर भरा
    </p>

    <form method="POST" enctype="multipart/form-data" class="mt-6">
        {% csrf_token %}

        <!-- LOCATION SECTION -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">

            <div>
                <label class="font-semibold">जिल्हा</label>
                <select id="district" name="district" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">जिल्हा निवडा</option>
                </select>
            </div>

            <div>
                <label class="font-semibold">तालुका</label>
                <select id="taluka" name="taluka" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">तालुका निवडा</option>
                </select>
            </div>

            <div>
                <label class="font-semibold">गाव</label>
                <select id="village" name="village" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                    <option value="">गाव निवडा</option>
                </select>
            </div>

        </div>

        <!-- RATE DETAILS -->
        <div class="mt-6 border-t pt-4">
            <h3 class="font-semibold text-sm text-gray-700 mb-3">दर माहिती</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">

                <div>
                    <label class="font-semibold">वर्ष (Year)</label>
                    <input type="text" name="year" required
                        placeholder="उदा. 2025-2026"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div class="md:col-span-2">
                    <label class="font-semibold">मूल्यांकन प्रकार (Assessment Type)</label>
                    <input type="text" name="assessment_type" required
                        placeholder="उदा. जिरायत, बागायत, निवासी"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">आकारणी श्रेणी - किमान (Range Min)</label>
                    <input type="number" step="0.01" name="assessment_range_min" required
                        placeholder="उदा. 0.00"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">आकारणी श्रेणी - कमाल (Range Max)</label>
                    <input type="number" step="0.01" name="assessment_range_max" required
                        placeholder="उदा. 10.00"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">दर (Rate) ₹</label>
                    <input type="number" step="0.01" name="rate" required
                        placeholder="उदा. 2298500"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="font-semibold">एकक (Unit)</label>
                    <select name="unit" required class="w-full border p-2 rounded focus:ring-2 focus:ring-orange-400">
                        <option value="हेक्टर" selected>हेक्टर</option>
                        <option value="चौ. मीटर">चौ. मीटर</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="font-semibold mb-3 block">दस्तऐवज अपलोड करा (Document Upload)</label>
                    
                    <!-- File Upload Container -->
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 bg-gray-50 hover:bg-gray-100 transition-colors duration-200" id="dropZone">
                        <div class="text-center">
                            <!-- Upload Icon -->
                            <div class="mx-auto w-16 h-16 mb-4 flex items-center justify-center bg-orange-100 rounded-full">
                                <svg class="w-8 h-8 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                </svg>
                            </div>
                            
                            <h3 class="text-base font-semibold text-gray-700 mb-2">फाइल निवडा किंवा येथे ड्रॅग करा</h3>
                            <p class="text-sm text-gray-500 mb-4">PDF, JPG, PNG, DOC, DOCX (प्रत्येक कमाल 5MB)</p>
                            
                            <!-- Hidden File Input -->
                            <input type="file" id="documents" name="documents" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" multiple class="hidden">
                            
                            <!-- Browse Button -->
                            <button type="button" onclick="document.getElementById('documents').click()" 
                                class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors duration-200">
                                फाइल निवडा
                            </button>
                        </div>
                    </div>
                    
                    <!-- Error Message -->
                    <p id="file-error" class="text-sm text-red-600 mt-2 hidden"></p>
                    
                    <!-- Selected Files List -->
                    <div id="filesList" class="mt-4 space-y-2 hidden">
                        <h4 class="text-sm font-semibold text-gray-700 mb-2">निवडलेल्या फाइल्स:</h4>
                        <div id="filesContainer" class="space-y-2"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- BUTTONS -->
        <div class="flex gap-3 mt-6">
            <button type="button" onclick="window.history.back()"
                class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded">
                ← मागे जा
            </button>
            <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">
                सबमिट करा
            </button>
            <a href="{% url 'ready_reckoner_list' %}"
                class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded">
                नोंदी पहा
            </a>
        </div>

    </form>

</div>

<script>

let fullData = [];

fetch('/api/location-data/')
    .then(res => res.json())
    .then(data => {
        fullData = data.villages;
        let districtDropdown = document.getElementById("district");
        let districts = [...new Set(fullData.map(v => v.district))];
        districts.forEach(d => {
            if (d) districtDropdown.add(new Option(d, d));
        });
    });

document.getElementById("district").addEventListener("change", function () {
    let district = this.value;
    let talukaDropdown = document.getElementById("taluka");
    let villageDropdown = document.getElementById("village");

    talukaDropdown.innerHTML = '<option value="">तालुका निवडा</option>';
    villageDropdown.innerHTML = '<option value="">गाव निवडा</option>';

    let talukas = [...new Set(fullData.filter(v => v.district === district).map(v => v.taluka))];
    talukas.forEach(t => talukaDropdown.add(new Option(t, t)));
});

document.getElementById("taluka").addEventListener("change", function () {
    let taluka = this.value;
    let district = document.getElementById("district").value;
    let villageDropdown = document.getElementById("village");

    villageDropdown.innerHTML = '<option value="">गाव निवडा</option>';

    let uniqueVillages = [...new Set(
        fullData.filter(v => v.taluka === taluka && v.district === district).map(v => v.village_name)
    )];
    uniqueVillages.forEach(v => villageDropdown.add(new Option(v, v)));
});

// File Upload Handler with Drag & Drop and Progress
(function() {
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('documents');
    const fileError = document.getElementById('file-error');
    const filesList = document.getElementById('filesList');
    const filesContainer = document.getElementById('filesContainer');
    const maxSize = 5 * 1024 * 1024; // 5MB
    let selectedFiles = [];

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    // Highlight drop zone when dragging over it
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.classList.add('border-orange-500', 'bg-orange-50');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.classList.remove('border-orange-500', 'bg-orange-50');
        }, false);
    });

    // Handle dropped files
    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    }, false);

    // Handle selected files from input
    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        fileError.classList.add('hidden');
        selectedFiles = [];
        
        // Validate and add files
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            
            if (file.size > maxSize) {
                fileError.textContent = `"${file.name}" फाइल साइझ 5MB पेक्षा जास्त आहे.`;
                fileError.classList.remove('hidden');
                continue;
            }
            
            selectedFiles.push(file);
        }
        
        if (selectedFiles.length > 0) {
            displayFiles();
            filesList.classList.remove('hidden');
        } else {
            filesList.classList.add('hidden');
        }
    }

    function displayFiles() {
        filesContainer.innerHTML = '';
        
        selectedFiles.forEach((file, index) => {
            const fileItem = createFileItem(file, index);
            filesContainer.appendChild(fileItem);
        });
    }

    function createFileItem(file, index) {
        const div = document.createElement('div');
        div.className = 'bg-white border border-gray-200 rounded-lg p-3 hover:shadow-md transition-shadow duration-200';
        
        const fileSize = formatFileSize(file.size);
        const fileIcon = getFileIcon(file.name);
        
        div.innerHTML = `
            <div class="flex items-center gap-3">
                <!-- File Icon -->
                <div class="flex-shrink-0 w-10 h-10 flex items-center justify-center bg-gray-100 rounded-lg">
                    ${fileIcon}
                </div>
                
                <!-- File Info -->
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate">${file.name}</p>
                    <p class="text-xs text-gray-500">${fileSize}</p>
                </div>
                
                <!-- Remove Button -->
                <button type="button" onclick="removeFile(${index})" 
                    class="flex-shrink-0 w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Progress Bar (hidden initially) -->
            <div class="mt-2 hidden" id="progress-${index}">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs text-gray-600">अपलोड होत आहे...</span>
                    <span class="text-xs font-medium text-orange-600" id="progress-percent-${index}">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-1.5">
                    <div class="bg-orange-600 h-1.5 rounded-full transition-all duration-300" id="progress-bar-${index}" style="width: 0%"></div>
                </div>
            </div>
        `;
        
        return div;
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        
        const icons = {
            'pdf': '<svg class="w-6 h-6 text-red-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>',
            'doc': '<svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>',
            'docx': '<svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>',
            'jpg': '<svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3h12v14H4V3zm2 2v10h8V5H6z"/></svg>',
            'jpeg': '<svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3h12v14H4V3zm2 2v10h8V5H6z"/></svg>',
            'png': '<svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3h12v14H4V3zm2 2v10h8V5H6z"/></svg>',
        };
        
        return icons[ext] || '<svg class="w-6 h-6 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>';
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Make removeFile function global
    window.removeFile = function(index) {
        selectedFiles.splice(index, 1);
        
        // Update the file input
        const dt = new DataTransfer();
        selectedFiles.forEach(file => dt.items.add(file));
        fileInput.files = dt.files;
        
        if (selectedFiles.length > 0) {
            displayFiles();
        } else {
            filesList.classList.add('hidden');
        }
    };

    // Simulate upload progress on form submit
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        if (selectedFiles.length > 0) {
            // Show progress bars
            selectedFiles.forEach((file, index) => {
                const progressDiv = document.getElementById(`progress-${index}`);
                if (progressDiv) {
                    progressDiv.classList.remove('hidden');
                    simulateProgress(index);
                }
            });
        }
    });

    function simulateProgress(index) {
        const progressBar = document.getElementById(`progress-bar-${index}`);
        const progressPercent = document.getElementById(`progress-percent-${index}`);
        
        if (!progressBar || !progressPercent) return;
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 30;
            if (progress > 100) progress = 100;
            
            progressBar.style.width = progress + '%';
            progressPercent.textContent = Math.round(progress) + '%';
            
            if (progress >= 100) {
                clearInterval(interval);
            }
        }, 200);
    }
})();

</script>

{% endblock %}
