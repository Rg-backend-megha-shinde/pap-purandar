{% extends "base.html" %}

{% block content %}

<div class="max-w-4xl mx-auto bg-white p-6 border border-gray-300 mt-6 rounded-lg shadow">

    <!-- HEADER -->
    <h2 class="text-center font-bold text-xl underline">
        ७/१२ उतारा नोंद
    </h2>
    <p class="text-center text-sm mt-1 text-gray-500">
        जमीन नोंदवही माहिती भरा
    </p>

    <form method="POST" enctype="multipart/form-data" class="mt-6">
        {% csrf_token %}

        <!-- LOCATION SECTION -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">

            <div>
                <label class="font-semibold">जिल्हा</label>
                <select id="district" name="district" required class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
                    <option value="">जिल्हा निवडा</option>
                </select>
            </div>

            <div>
                <label class="font-semibold">तालुका</label>
                <select id="taluka" name="taluka" required class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
                    <option value="">तालुका निवडा</option>
                </select>
            </div>

            <div>
                <label class="font-semibold">गाव</label>
                <select id="village" name="village" required class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
                    <option value="">गाव निवडा</option>
                </select>
            </div>

            <div>
                <label class="font-semibold">गट क्रमांक</label>
                <select id="gut" name="gut_number" required class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
                    <option value="">गट क्रमांक निवडा</option>
                </select>
            </div>

        </div>

        <!-- FARMER & LAND DETAILS -->
        <div class="mt-6 border-t pt-4">
            <h3 class="font-semibold text-sm text-gray-700 mb-3">शेतकरी माहिती</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">

                <div class="md:col-span-2">
                    <div class="flex gap-2 mb-1">
                        <span class="font-semibold flex-1">शेतकऱ्यांची नावे</span>
                        <span class="font-semibold w-36 text-center">मूळ क्षेत्र</span>
                        <span class="font-semibold w-36 text-center">पोटखराबा</span>
                        <span class="w-8"></span>
                    </div>
                    <div id="farmer-list" class="space-y-2">
                        <div class="flex gap-2 items-center">
                            <input type="text" name="farmer_name[]" required
                                placeholder="पूर्ण नाव टाका"
                                class="flex-1 border p-2 rounded focus:ring-2 focus:ring-green-400">
                            <input type="text" name="total_area[]" placeholder="उदा. 1-65"
                                class="w-36 border p-2 rounded focus:ring-2 focus:ring-green-400">
                            <input type="text" name="potkharaba[]" placeholder="उदा. 0-53"
                                class="w-36 border p-2 rounded focus:ring-2 focus:ring-green-400">
                            <button type="button" onclick="removeFarmer(this)"
                                class="text-red-500 font-bold px-2 hidden">✕</button>
                        </div>
                    </div>
                    <button type="button" onclick="addFarmer()"
                        class="mt-2 text-sm text-green-700 border border-green-500 px-3 py-1 rounded hover:bg-green-50">
                        + शेतकरी जोडा
                    </button>
                </div>

                <div>
                    <label class="font-semibold">मूल्यांकन प्रकार (Assessment Type)</label>
                    <select id="assessment_type" name="assessment_type" class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
                        <option value="">गाव निवडल्यावर दिसेल</option>
                    </select>
                </div>

                <div>
                    <label class="font-semibold">रेडी रेकनर वर्ष</label>
                    <select id="rate_year_select" name="rate_year" class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
                        <option value="20252026" selected>20252026</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="font-semibold">आकारणी</label>
                    <input type="text" id="aakarnee" name="aakarnee"
                        placeholder="उदा. 10.1.1"
                        class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
                </div>

                <div class="md:col-span-2">
                    <label class="font-semibold">लागू दर (Rate Applied)</label>
                    <input type="text" id="rate_applied" name="rate_applied"
                        placeholder="आकारणी भरल्यावर आपोआप भरेल"
                        class="w-full border p-2 rounded bg-gray-50 focus:ring-2 focus:ring-green-400">
                </div>

            </div>
        </div>

        <!-- DOCUMENT UPLOAD SECTION -->
        <div class="mt-6 border-t pt-4">
            <label class="font-semibold text-sm text-gray-700 mb-3 block">दस्तऐवज अपलोड करा (Document Upload)</label>
            
            <!-- File Upload Container -->
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 bg-gray-50 hover:bg-gray-100 transition-colors duration-200" id="dropZone">
                <div class="text-center">
                    <!-- Upload Icon -->
                    <div class="mx-auto w-16 h-16 mb-4 flex items-center justify-center bg-green-100 rounded-full">
                        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                    
                    <h3 class="text-base font-semibold text-gray-700 mb-2">फाइल्स निवडा किंवा येथे ड्रॅग करा</h3>
                    <p class="text-sm text-gray-500 mb-4">PDF, JPG, PNG, DOC, DOCX (प्रत्येक कमाल 5MB)</p>
                    
                    <!-- Hidden File Input -->
                    <input type="file" id="documents" name="documents" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" multiple class="hidden">
                    
                    <!-- Browse Button -->
                    <button type="button" onclick="document.getElementById('documents').click()" 
                        class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors duration-200">
                        फाइल निवडा
                    </button>
                </div>
            </div>
            
            <!-- Error Message -->
            <p id="file-error" class="text-sm text-red-600 mt-2 hidden"></p>
            
            <!-- Selected Files List -->
            <div id="filesList" class="mt-4 space-y-2 hidden">
                <h4 class="text-sm font-semibold text-gray-700 mb-2">निवडलेल्या फाइल्स:</h4>
                <div id="filesContainer" class="space-y-2"></div>
            </div>
        </div>

        <!-- BUTTONS -->
        <div class="flex gap-3 mt-6">
            <button type="button" onclick="window.history.back()"
                class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded">
                ← मागे जा
            </button>
            <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">
                सबमिट करा
            </button>
            <a href="{% url 'land_record_712_list' %}"
                class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded">
                नोंदी पहा
            </a>
        </div>

    </form>

</div>

<script>

let fullData = [];

fetch('/api/location-data/')
    .then(res => res.json())
    .then(data => {
        fullData = data.villages;
        let districtDropdown = document.getElementById("district");
        let districts = [...new Set(fullData.map(v => v.district))];
        districts.forEach(d => {
            if (d) districtDropdown.add(new Option(d, d));
        });
    });

document.getElementById("district").addEventListener("change", function () {
    let district = this.value;
    let talukaDropdown = document.getElementById("taluka");
    let villageDropdown = document.getElementById("village");
    let gutDropdown = document.getElementById("gut");

    talukaDropdown.innerHTML = '<option value="">तालुका निवडा</option>';
    villageDropdown.innerHTML = '<option value="">गाव निवडा</option>';
    gutDropdown.innerHTML = '<option value="">गट क्रमांक निवडा</option>';
    resetAssessmentAndYear();

    let talukas = [...new Set(fullData.filter(v => v.district === district).map(v => v.taluka))];
    talukas.forEach(t => talukaDropdown.add(new Option(t, t)));
});

document.getElementById("taluka").addEventListener("change", function () {
    let taluka = this.value;
    let district = document.getElementById("district").value;
    let villageDropdown = document.getElementById("village");
    let gutDropdown = document.getElementById("gut");

    villageDropdown.innerHTML = '<option value="">गाव निवडा</option>';
    gutDropdown.innerHTML = '<option value="">गट क्रमांक निवडा</option>';
    resetAssessmentAndYear();

    let uniqueVillages = [...new Set(
        fullData.filter(v => v.taluka === taluka && v.district === district).map(v => v.village_name)
    )];
    uniqueVillages.forEach(v => villageDropdown.add(new Option(v, v)));
});

document.getElementById("village").addEventListener("change", function () {
    let village = this.value;
    let gutDropdown = document.getElementById("gut");

    gutDropdown.innerHTML = '<option value="">गट क्रमांक निवडा</option>';
    resetAssessmentAndYear();
    if (!village) return;

    fetch(`/api/gut-numbers/${village}/`)
        .then(res => res.json())
        .then(data => {
            data.gut_numbers.forEach(g => gutDropdown.add(new Option(g, g)));
        });

    fetch(`/api/assessment-types/${village}/`)
        .then(res => res.json())
        .then(data => {
            let assessmentDropdown = document.getElementById("assessment_type");
            assessmentDropdown.innerHTML = '<option value="">मूल्यांकन प्रकार निवडा</option>';
            data.assessment_types.forEach(t => assessmentDropdown.add(new Option(t, t)));
        });
});

document.getElementById("assessment_type").addEventListener("change", function () {
    let village = document.getElementById("village").value;
    let assessmentType = this.value;
    
    // Clear rate data and applied rate
    rateData = [];
    document.getElementById('rate_applied').value = '';
    
    if (!village || !assessmentType) return;

    fetch(`/api/years/${village}/${encodeURIComponent(assessmentType)}/`)
        .then(res => res.json())
        .then(data => {
            let yearDropdown = document.getElementById("rate_year_select");
            if (data.years && data.years.length > 0) {
                yearDropdown.innerHTML = '';
                // Show years exactly as they are in the database
                data.years.forEach(y => yearDropdown.add(new Option(y, y)));
                // Select first year by default
                yearDropdown.selectedIndex = 0;
                // Fetch rates immediately after populating years
                fetchRates();
            } else {
                // Keep default year if no years found
                yearDropdown.innerHTML = '<option value="20252026" selected>20252026</option>';
                // Try to fetch rates with default year
                fetchRates();
            }
        });
});

document.getElementById("rate_year_select").addEventListener("change", function () {
    fetchRates();
});

let rateData = [];

function fetchRates() {
    const village = document.getElementById("village").value;
    const assessmentType = document.getElementById("assessment_type").value;
    const year = document.getElementById("rate_year_select").value;
    
    console.log('Fetching rates for:', { village, assessmentType, year });
    
    rateData = [];
    document.getElementById('rate_applied').value = '';
    
    if (!village || !assessmentType || !year) {
        console.log('Missing required fields for rate fetch');
        return;
    }

    fetch(`/api/rates/${village}/${encodeURIComponent(assessmentType)}/?year=${encodeURIComponent(year)}`)
        .then(res => res.json())
        .then(data => {
            console.log('Rates fetched:', data.rates);
            rateData = data.rates;
            applyRate();
        })
        .catch(error => {
            console.error('Error fetching rates:', error);
        });
}

document.getElementById("aakarnee").addEventListener("input", applyRate);

function applyRate() {
    let aakarnee = parseFloat(document.getElementById("aakarnee").value);
    let rateField = document.getElementById("rate_applied");
    
    console.log('Applying rate for aakarnee:', aakarnee, 'Available rates:', rateData);
    
    rateField.value = '';
    
    if (isNaN(aakarnee) || rateData.length === 0) {
        console.log('Cannot apply rate - invalid aakarnee or no rate data');
        return;
    }
    
    let match = rateData.find(r => aakarnee >= r.assessment_range_min && aakarnee <= r.assessment_range_max);
    
    if (match) {
        console.log('Rate matched:', match);
        rateField.value = match.rate;
    } else {
        console.log('No matching rate found for aakarnee:', aakarnee);
    }
}

function resetAssessmentAndYear() {
    document.getElementById("assessment_type").innerHTML = '<option value="">गाव निवडल्यावर दिसेल</option>';
    resetYearAndRate();
}

function resetYearAndRate() {
    document.getElementById("rate_year_select").innerHTML = '<option value="20252026" selected>20252026</option>';
    rateData = [];
    document.getElementById('rate_applied').value = '';
}

function addFarmer() {
    const list = document.getElementById('farmer-list');
    const row = document.createElement('div');
    row.className = 'flex gap-2 items-center';
    row.innerHTML = `<input type="text" name="farmer_name[]" placeholder="पूर्ण नाव टाका" class="flex-1 border p-2 rounded focus:ring-2 focus:ring-green-400">
        <input type="text" name="total_area[]" placeholder="मूळ क्षेत्र (उदा. 1-65)" class="w-36 border p-2 rounded focus:ring-2 focus:ring-green-400">
        <input type="text" name="potkharaba[]" placeholder="पोटखराबा (उदा. 0-53)" class="w-36 border p-2 rounded focus:ring-2 focus:ring-green-400">
        <button type="button" onclick="removeFarmer(this)" class="text-red-500 font-bold px-2">✕</button>`;
    list.appendChild(row);
}

function removeFarmer(btn) {
    const list = document.getElementById('farmer-list');
    if (list.children.length > 1) btn.parentElement.remove();
}

// File Upload Handler with Drag & Drop and Progress
(function() {
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('documents');
    const fileError = document.getElementById('file-error');
    const filesList = document.getElementById('filesList');
    const filesContainer = document.getElementById('filesContainer');
    const maxSize = 5 * 1024 * 1024; // 5MB
    let selectedFiles = [];

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    // Highlight drop zone when dragging over it
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.classList.add('border-green-500', 'bg-green-50');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.classList.remove('border-green-500', 'bg-green-50');
        }, false);
    });

    // Handle dropped files
    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    }, false);

    // Handle selected files from input
    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        fileError.classList.add('hidden');
        selectedFiles = [];
        
        // Validate and add files
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            
            if (file.size > maxSize) {
                fileError.textContent = `"${file.name}" फाइल साइझ 5MB पेक्षा जास्त आहे.`;
                fileError.classList.remove('hidden');
                continue;
            }
            
            selectedFiles.push(file);
        }
        
        if (selectedFiles.length > 0) {
            displayFiles();
            filesList.classList.remove('hidden');
        } else {
            filesList.classList.add('hidden');
        }
    }

    function displayFiles() {
        filesContainer.innerHTML = '';
        
        selectedFiles.forEach((file, index) => {
            const fileItem = createFileItem(file, index);
            filesContainer.appendChild(fileItem);
        });
    }

    function createFileItem(file, index) {
        const div = document.createElement('div');
        div.className = 'bg-white border border-gray-200 rounded-lg p-3 hover:shadow-md transition-shadow duration-200';
        
        const fileSize = formatFileSize(file.size);
        const fileIcon = getFileIcon(file.name);
        
        div.innerHTML = `
            <div class="flex items-center gap-3">
                <!-- File Icon -->
                <div class="flex-shrink-0 w-10 h-10 flex items-center justify-center bg-gray-100 rounded-lg">
                    ${fileIcon}
                </div>
                
                <!-- File Info -->
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate">${file.name}</p>
                    <p class="text-xs text-gray-500">${fileSize}</p>
                </div>
                
                <!-- Remove Button -->
                <button type="button" onclick="removeFile(${index})" 
                    class="flex-shrink-0 w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Progress Bar (hidden initially) -->
            <div class="mt-2 hidden" id="progress-${index}">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs text-gray-600">अपलोड होत आहे...</span>
                    <span class="text-xs font-medium text-green-600" id="progress-percent-${index}">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-1.5">
                    <div class="bg-green-600 h-1.5 rounded-full transition-all duration-300" id="progress-bar-${index}" style="width: 0%"></div>
                </div>
            </div>
        `;
        
        return div;
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        
        const icons = {
            'pdf': '<svg class="w-6 h-6 text-red-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>',
            'doc': '<svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>',
            'docx': '<svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>',
            'jpg': '<svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3h12v14H4V3zm2 2v10h8V5H6z"/></svg>',
            'jpeg': '<svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3h12v14H4V3zm2 2v10h8V5H6z"/></svg>',
            'png': '<svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3h12v14H4V3zm2 2v10h8V5H6z"/></svg>',
        };
        
        return icons[ext] || '<svg class="w-6 h-6 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path d="M4 18h12V6h-4V2H4v16zm-2 1V0h12l4 4v16H2v-1z"/></svg>';
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Make removeFile function global
    window.removeFile = function(index) {
        selectedFiles.splice(index, 1);
        
        // Update the file input
        const dt = new DataTransfer();
        selectedFiles.forEach(file => dt.items.add(file));
        fileInput.files = dt.files;
        
        if (selectedFiles.length > 0) {
            displayFiles();
        } else {
            filesList.classList.add('hidden');
        }
    };

    // Simulate upload progress on form submit
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        if (selectedFiles.length > 0) {
            // Show progress bars
            selectedFiles.forEach((file, index) => {
                const progressDiv = document.getElementById(`progress-${index}`);
                if (progressDiv) {
                    progressDiv.classList.remove('hidden');
                    simulateProgress(index);
                }
            });
        }
    });

    function simulateProgress(index) {
        const progressBar = document.getElementById(`progress-bar-${index}`);
        const progressPercent = document.getElementById(`progress-percent-${index}`);
        
        if (!progressBar || !progressPercent) return;
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 30;
            if (progress > 100) progress = 100;
            
            progressBar.style.width = progress + '%';
            progressPercent.textContent = Math.round(progress) + '%';
            
            if (progress >= 100) {
                clearInterval(interval);
            }
        }, 200);
    }
})();


</script>

{% endblock %}
